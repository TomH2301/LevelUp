name: LevelUp
options:
  bundleIdPrefix: de.hemme
targets:
  LevelUp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/LevelUp
    info:
      path: Sources/LevelUp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: LevelUp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hemme.levelup
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
