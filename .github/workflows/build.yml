name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app for iPhone
        run: |
          xcodebuild \
            -project LevelUp.xcodeproj \
            -scheme LevelUp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package as unsigned .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LevelUp.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r LevelUp.ipa Payload
          rm -rf Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LevelUp-ipa
          path: LevelUp.ipa

      - name: Publish as AltStore source (für Sideloading ohne Kabel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.${{ github.run_number }}"
          VERSION_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SIZE="$(stat -f%z LevelUp.ipa)"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/latest-build/LevelUp.ipa"
          ICON_URL="https://github.com/${{ github.repository }}/releases/download/latest-build/icon.png"

          convert -size 512x512 xc:'#3f6fd6' icon.png

          cat > source.json <<EOF
          {
            "name": "LevelUp Dev Source",
            "identifier": "de.hemme.levelup.source",
            "apps": [
              {
                "name": "LevelUp",
                "bundleIdentifier": "de.hemme.levelup",
                "developerName": "Tom Hemme",
                "version": "$VERSION",
                "versionDate": "$VERSION_DATE",
                "versionDescription": "Automatischer Dev-Build (Run #${{ github.run_number }})",
                "downloadURL": "$DOWNLOAD_URL",
                "localizedDescription": "LevelUp Fitness-RPG (Dev-Build)",
                "iconURL": "$ICON_URL",
                "size": $SIZE
              }
            ]
          }
          EOF

          if gh release view latest-build --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest-build LevelUp.ipa source.json icon.png --repo "${{ github.repository }}" --clobber
          else
            gh release create latest-build LevelUp.ipa source.json icon.png \
              --repo "${{ github.repository }}" \
              --title "Latest Dev Build" \
              --notes "Wird bei jedem Push automatisch aktualisiert. Source-URL für AltStore: siehe source.json." \
              --prerelease
          fi
